name: Deploy Horizon Studio to GitHub Pages

# Publica somente a subpasta Dev-Web-Suf/ no GitHub Pages
# (projeto da disciplina de Programação Web Front-End — UTFPR).

on:
  push:
    branches: [main]
    paths:
      - 'Dev-Web-Suf/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar pasta Dev-Web-Suf como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Dev-Web-Suf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
